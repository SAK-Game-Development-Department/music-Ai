# 練習用の曲: メロディは「きらきら星」（フランス民謡・パブリックドメイン）
# 歌詞はこのリポジトリのオリジナル。替え歌の練習台に使う。
title: よぞらのほし
key: C major
tempo: 96
time: 4/4
style: pop
structure: [intro, A, B, A2, outro]
sections:
  intro:
    chords: "F | G | C | C"
  A:
    chords: "C | F C | F C | G C"
    melody: "C4:1 C4 G4 G4 | A4 A4 G4:2 | F4:1 F4 E4 E4 | D4 D4 C4:2"
    lyrics: "よぞらにひかる / ちいさなほしよ"
  B:
    chords: "C F | C G | C F | C G"
    melody: "G4:1 G4 F4 F4 | E4 E4 D4:2 | G4:1 G4 F4 F4 | E4 E4 D4:2"
    lyrics: "とおくのまちを / てらしているよ"
    energy: mid
  A2:
    base: A                 # A のメロディ・コードを使う（2番）
    lyrics: "{明日|あした}もきっと / あえるよね"   # 5モーラしかない → fit で自動調整
    fit: true
    energy: high
  outro:
    chords: "F G | C"
